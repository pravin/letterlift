[package]
name = "letterlift"
version = "0.1.1"
authors = ["Pravin Paratey"]
description = "A free word-ladder puzzle for the terminal: change one letter at a time to reach the goal"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/pravin/letterlift"
readme = "README.md"
keywords = ["game", "word", "puzzle", "terminal", "tui"]
categories = ["games", "command-line-utilities"]
exclude = ["img/", ".github/", "scripts/"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "letterlift"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
